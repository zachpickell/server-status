[package]
name = "server-panel"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
common = { version = "0.1.0", path = "../common" }
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
toml = "1.1.6"
